name: CI

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**

permissions: {}

jobs:
  gha-lint:
    permissions:
      contents: read
    uses: zunoser/reusable-workflows/.github/workflows/gha-lint.yml@cd4727a1d6777fb660aafe64570f18e760d4a966 # v1.1.0
