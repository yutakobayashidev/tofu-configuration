name: github-apply

# Applies the GitHub repository roots changed on main. Only this workflow on
# main, in the github-apply Environment, can sign with the apply App key.
# A daily run checks every root for drift instead. See
# docs/gcp-github-app-signing.md.

on:
  push:
    branches:
      - main
    paths:
      - "infra/services/github/repositories/**"
      - "infra/services/github/ci-roots"
      - ".github/workflows/github-apply.yml"
      - "flake.nix"
      - "flake.lock"
  # Pull request plans run with -refresh=false, so changes made on GitHub stay
  # hidden until an apply reverts them. Report them daily until the provider
  # can refresh with the plan App (#41).
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions: {}

# An unspecified shell runs without pipefail, so a failing command piped to tee
# would not fail its step.
defaults:
  run:
    shell: bash

# Applies run one at a time, in merge order. Drift checks use their own group:
# in the apply group, a queued drift check would cancel a pending apply.
concurrency:
  group: ${{ github.event_name == 'push' && 'github-apply' || 'github-drift' }}
  cancel-in-progress: false

jobs:
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: roots
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          # A change to the workflow, the CI root list, or the Nix shell affects
          # every root.
          if grep -qE '^(\.github/workflows/github-apply\.yml|infra/services/github/ci-roots$|flake\.(nix|lock))' <<<"$changed"; then
            roots=$(find infra/services/github/repositories -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          else
            roots=$(sed -nE 's#^infra/services/github/repositories/([^/]+)/.*#\1#p' <<<"$changed")
          fi
          grep -vE '^[[:space:]]*(#|$)' infra/services/github/ci-roots | sort -u > enabled
          json=$(sort -u <<<"$roots" | comm -12 - enabled | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "roots=$json" >> "$GITHUB_OUTPUT"
          echo "Roots to apply: $json"

  apply:
    needs: detect
    if: needs.detect.outputs.roots != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-apply
    permissions:
      contents: read
      id-token: write
      # Comment on the merged pull request when the apply fails.
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        root: ${{ fromJSON(needs.detect.outputs.roots) }}
    env:
      ROOT: infra/services/github/repositories/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: current
        run: |
          # Skip when a later commit on main changed this root: its own run
          # applies the newer configuration, and this run must not overwrite it.
          git fetch --quiet origin main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- "$ROOT"; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$ROOT changed after $GITHUB_SHA; the later run applies it"
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.current.outputs.apply == 'true'
        name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}

      - id: repository
        if: steps.current.outputs.apply == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          ROOT_NAME: ${{ matrix.root }}
        run: |
          name=$(sed -nE 's/^  name += "([^"]+)"$/\1/p' "$ROOT/module_gh_repo_kit.tf" | head -1)
          if [ "$name" != "$ROOT_NAME" ]; then
            echo "::error::$ROOT manages '$name', expected '$ROOT_NAME'"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Keep retrying the installation if apply already wrote state on an
          # earlier attempt of the push that introduced this repository root.
          if ! git cat-file -e "$BEFORE_SHA:$ROOT/module_gh_repo_kit.tf" 2>/dev/null; then
            echo "added=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.current.outputs.apply == 'true'
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/17441306233/locations/global/workloadIdentityPools/github-actions/providers/tofu-configuration
          service_account: github-app-apply@yuta-gh-signer.iam.gserviceaccount.com

      - id: state
        if: steps.current.outputs.apply == 'true'
        run: |
          # A root without state manages a repository that does not exist yet.
          nix develop .#github-ci -c tofu -chdir="$ROOT" init -input=false -no-color
          if [ -z "$(nix develop .#github-ci -c tofu -chdir="$ROOT" state list)" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - id: token
        if: steps.current.outputs.apply == 'true' && steps.state.outputs.new == 'false'
        uses: yagihash/ghat@v2.5.1
        with:
          app_id: "5875943"
          kms_project_id: yuta-gh-signer
          kms_location: asia-northeast1
          kms_keyring_id: github-apps
          kms_key_id: tofu-apply
          kms_key_version: "1"
          repositories: ${{ steps.repository.outputs.name }}
          permission_metadata: read
          permission_administration: write
          permission_issues: write
          permission_actions: read

      # A new root creates its repository. A token cannot be scoped to a
      # repository that does not exist, so it covers the whole installation, as
      # 10X does. ghat cannot request repository_creation, so the token keeps
      # all of the App's permissions. The created repository joins the
      # installation, and this token can configure it.
      - id: new_token
        if: steps.current.outputs.apply == 'true' && steps.state.outputs.new == 'true'
        uses: yagihash/ghat@v2.5.1
        with:
          app_id: "5875943"
          kms_project_id: yuta-gh-signer
          kms_location: asia-northeast1
          kms_keyring_id: github-apps
          kms_key_id: tofu-apply
          kms_key_version: "1"

      - name: Apply
        if: steps.current.outputs.apply == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token || steps.new_token.outputs.token }}
        run: |
          nix develop .#github-ci -c tofu -chdir="$ROOT" apply -input=false -no-color -auto-approve | tee apply.log
          {
            echo "### Apply for \`$ROOT\`"
            echo '```'
            sed -n '/OpenTofu will perform\|No changes\./,$p' apply.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ghat cannot request installation_repositories explicitly. Scope this
      # token to the newly created repository and use it only for this step.
      - id: plan_installation_token
        if: steps.current.outputs.apply == 'true' && (steps.state.outputs.new == 'true' || steps.repository.outputs.added == 'true')
        uses: yagihash/ghat@v2.5.1
        with:
          app_id: "5875943"
          kms_project_id: yuta-gh-signer
          kms_location: asia-northeast1
          kms_keyring_id: github-apps
          kms_key_id: tofu-apply
          kms_key_version: "1"
          repositories: ${{ steps.repository.outputs.name }}

      - name: Add the repository to the Plan App
        if: steps.plan_installation_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.plan_installation_token.outputs.token }}
          REPOSITORY_NAME: ${{ steps.repository.outputs.name }}
          # Installation of yuta-tofu-plan on yutakobayashidev.
          PLAN_INSTALLATION_ID: "184708775"
        run: |
          repository_id=$(gh api "repos/$GITHUB_REPOSITORY_OWNER/$REPOSITORY_NAME" --jq .id)
          gh api --method PUT --silent -H "X-GitHub-Api-Version: 2026-03-10" \
            "user/installations/$PLAN_INSTALLATION_ID/repositories/$repository_id"

      # As 10X does, report a failed apply to chat and to the merged pull
      # request. The Discord webhook URL comes from Secret Manager, which only
      # the apply service account can read. See docs/gcp-github-app-signing.md.
      - name: Report the failure
        if: failure() && steps.current.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_NAME: ${{ matrix.root }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          message="github-apply failed for \`$ROOT_NAME\` at ${GITHUB_SHA:0:7}${pr:+ (#$pr)}: $RUN_URL"
          webhook=$(gcloud secrets versions access latest --secret=github-apply-discord-webhook --project=yuta-gh-signer)
          if [ -n "$webhook" ]; then
            echo "::add-mask::$webhook"
            jq -n --arg c "$message" '{content: $c, allowed_mentions: {parse: []}}' |
              curl -sS --fail -o /dev/null -H 'Content-Type: application/json' -d @- "$webhook" ||
              echo "::warning::Could not post to Discord"
          else
            echo "::warning::Could not read the Discord webhook from Secret Manager"
          fi
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$message" || echo "::warning::Could not comment on #$pr"
          fi

  drift-roots:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: roots
        run: |
          json=$(grep -vE '^[[:space:]]*(#|$)' infra/services/github/ci-roots | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "roots=$json" >> "$GITHUB_OUTPUT"

  # Refresh each root with the apply App and report differences from the state.
  # The job only plans; it never applies or writes state.
  drift:
    needs: drift-roots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-apply
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        root: ${{ fromJSON(needs.drift-roots.outputs.roots) }}
    env:
      ROOT: infra/services/github/repositories/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/17441306233/locations/global/workloadIdentityPools/github-actions/providers/tofu-configuration
          service_account: github-app-apply@yuta-gh-signer.iam.gserviceaccount.com

      - id: state
        run: |
          nix develop .#github-ci -c tofu -chdir="$ROOT" init -input=false -no-color
          if [ -z "$(nix develop .#github-ci -c tofu -chdir="$ROOT" state list)" ]; then
            echo "::notice::$ROOT has no state yet; skipping"
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - id: token
        if: steps.state.outputs.new == 'false'
        uses: yagihash/ghat@v2.5.1
        with:
          app_id: "5875943"
          kms_project_id: yuta-gh-signer
          kms_location: asia-northeast1
          kms_keyring_id: github-apps
          kms_key_id: tofu-apply
          kms_key_version: "1"
          repositories: ${{ matrix.root }}
          permission_metadata: read
          permission_administration: write
          permission_issues: write
          permission_actions: read

      # GitHub returns a new ruleset etag on every read, so an etag-only change
      # is not drift. -lock=false keeps this read-only check from blocking an
      # apply of the same root.
      - id: plan
        if: steps.state.outputs.new == 'false'
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          nix develop .#github-ci -c tofu -chdir="$ROOT" plan -refresh-only \
            -input=false -no-color -lock=false -out=drift.tfplan | tee plan.log
          drifted=$(nix develop .#github-ci -c tofu -chdir="$ROOT" show -json drift.tfplan |
            jq -r '.resource_drift[]?
              | select((.change.before // {} | del(.etag)) != (.change.after // {} | del(.etag)))
              | .address')
          rm -f "$ROOT/drift.tfplan"
          {
            echo "### Drift check for \`$ROOT\`"
            if [ -n "$drifted" ]; then
              echo '```'
              sed -n '/Objects have changed outside of OpenTofu/,$p' plan.log
              echo '```'
            else
              echo "No drift."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$drifted" ]; then
            echo "::warning::$ROOT has drifted: $(paste -sd ' ' <<<"$drifted")"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report drift or failure
        if: steps.plan.outputs.drift == 'true' || failure()
        env:
          ROOT_NAME: ${{ matrix.root }}
          DRIFT: ${{ steps.plan.outputs.drift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ "$DRIFT" = true ]; then
            message="GitHub settings of \`$ROOT_NAME\` differ from its OpenTofu state. The next apply reverts them unless the root is updated: $RUN_URL"
          else
            message="github drift check failed for \`$ROOT_NAME\`: $RUN_URL"
          fi
          webhook=$(gcloud secrets versions access latest --secret=github-apply-discord-webhook --project=yuta-gh-signer)
          if [ -n "$webhook" ]; then
            echo "::add-mask::$webhook"
            jq -n --arg c "$message" '{content: $c, allowed_mentions: {parse: []}}' |
              curl -sS --fail -o /dev/null -H 'Content-Type: application/json' -d @- "$webhook" ||
              echo "::warning::Could not post to Discord"
          else
            echo "::warning::Could not read the Discord webhook from Secret Manager"
          fi
