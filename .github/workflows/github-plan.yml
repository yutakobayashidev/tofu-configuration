name: github-plan

# Plans the GitHub repository roots changed by a pull request. Each job signs a
# GitHub App JWT with Cloud KMS through Workload Identity Federation and gets an
# installation token limited to the one repository its root manages.
# See docs/gcp-github-app-signing.md.

on:
  # github-new-repository dispatches this workflow for the pull request it
  # opens, because a pull request opened with GITHUB_TOKEN triggers no runs.
  workflow_dispatch:
  # Every pull request runs, so plan-gate always reports. The detect job picks
  # the roots to plan and leaves the plan job skipped when there are none.
  pull_request:

permissions: {}

# An unspecified shell runs without pipefail, so a failing command piped to tee
# would not fail its step.
defaults:
  run:
    shell: bash

concurrency:
  group: github-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: roots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            # A dispatched run plans the changes of its branch against main.
            BASE_SHA=$(git merge-base origin/main "$GITHUB_SHA")
            HEAD_SHA=$GITHUB_SHA
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # Shared modules and CI inputs can change a root without editing it.
          if grep -qE '^(\.github/workflows/github-plan\.yml|infra/services/github/(ci-roots$|modules/)|flake\.(nix|lock)|policy/terraform/)' <<<"$changed"; then
            roots=$(find infra/services/github/repositories -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          else
            roots=$(sed -nE 's#^infra/services/github/repositories/([^/]+)/.*#\1#p' <<<"$changed")
          fi
          grep -vE '^[[:space:]]*(#|$)' infra/services/github/ci-roots | sort -u > enabled
          json=$(sort -u <<<"$roots" | comm -12 - enabled | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "roots=$json" >> "$GITHUB_OUTPUT"
          echo "Roots to plan: $json"

  plan:
    needs: detect
    if: needs.detect.outputs.roots != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-plan
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        root: ${{ fromJSON(needs.detect.outputs.roots) }}
    env:
      ROOT: infra/services/github/repositories/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}

      - id: repository
        env:
          ROOT_NAME: ${{ matrix.root }}
        run: |
          # The token covers only the repository named in this root.
          name=$(sed -nE 's/^  name += "([^"]+)"$/\1/p' "$ROOT/module_gh_repo_kit.tf" | head -1)
          if [ "$name" != "$ROOT_NAME" ]; then
            echo "::error::$ROOT manages '$name', expected '$ROOT_NAME'"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/17441306233/locations/global/workloadIdentityPools/github-actions/providers/tofu-configuration
          service_account: github-app-plan@yuta-gh-signer.iam.gserviceaccount.com

      # The dotnix and tofu-configuration roots declare the Discord webhook for
      # repository events. Secret Manager holds a copy of the Discord root's
      # output; see docs/gcp-github-app-signing.md.
      - name: Read the Discord webhook for repository events
        run: |
          url=$(gcloud secrets versions access latest --secret=github-repository-discord-webhook --project=yuta-gh-signer)
          echo "::add-mask::$url"
          echo "TF_VAR_discord_github_webhook_url=$url" >> "$GITHUB_ENV"

      - id: state
        env:
          ROOT_NAME: ${{ matrix.root }}
        run: |
          # A root without state manages a repository that does not exist yet.
          if listing=$(gcloud storage ls "gs://yuta-gh-signer-github-tfstate/repositories/$ROOT_NAME/" 2>&1); then
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'matched no objects' <<<"$listing"; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            # Initializing an empty GCS prefix writes a lock and an empty state,
            # which the read-only plan service account cannot do. A new root
            # has no state to read, so plan it against an empty local state.
            printf 'terraform {\n  backend "local" {}\n}\n' > "$ROOT/ci_backend_override.tf"
          else
            echo "$listing"
            exit 1
          fi
          nix develop .#github-ci -c tofu -chdir="$ROOT" init -input=false -no-color

      - id: token
        if: steps.state.outputs.new == 'false'
        uses: yagihash/ghat@v2.5.1
        with:
          app_id: "5875937"
          kms_project_id: yuta-gh-signer
          kms_location: asia-northeast1
          kms_keyring_id: github-apps
          kms_key_id: tofu-plan
          kms_key_version: "1"
          repositories: ${{ steps.repository.outputs.name }}
          permission_metadata: read
          permission_administration: read
          permission_issues: read
          permission_actions: read
          permission_repository_hooks: read

      # A token cannot be scoped to a repository that does not exist, so a new
      # root gets a read-only token for the whole installation, as 10X does.
      - id: new_token
        if: steps.state.outputs.new == 'true'
        uses: yagihash/ghat@v2.5.1
        with:
          app_id: "5875937"
          kms_project_id: yuta-gh-signer
          kms_location: asia-northeast1
          kms_keyring_id: github-apps
          kms_key_id: tofu-plan
          kms_key_version: "1"
          permission_metadata: read
          permission_administration: read
          permission_issues: read
          permission_actions: read
          permission_repository_hooks: read

      - name: Plan
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token || steps.new_token.outputs.token }}
        run: |
          # The plan service account can only read state, so plan without a lock.
          # The REST API omits merge settings for the read-only plan App, and
          # provider v6.13.0 records them as false. Plan against the state from
          # the last apply until the provider reads them over GraphQL
          # (integrations/terraform-provider-github#3741).
          # See docs/gcp-github-app-signing.md.
          nix develop .#github-ci -c tofu -chdir="$ROOT" plan -input=false -no-color -lock=false -refresh=false -out=tfplan | tee plan.log
          nix develop .#github-ci -c tofu -chdir="$ROOT" show -json tfplan > plan.json
          nix develop .#github-ci -c conftest test --policy policy/terraform plan.json
          {
            echo "### Plan for \`$ROOT\`"
            echo '```'
            sed -n '/OpenTofu will perform\|No changes\./,$p' plan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The single required check on main. It passes when every planned root
  # passed, or when the pull request changes no root.
  plan-gate:
    if: always()
    needs: [detect, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
